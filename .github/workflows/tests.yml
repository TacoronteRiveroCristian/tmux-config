# Las pruebas de tests/run en cada push y pull request: x86 en un runner normal y
# las Raspberry en uno arm64 nativo (sin emular). Y dos que tardan un segundo:
# tests/atajos.sh (los atajos Espacio+tecla del código y los del CHEATSHEET
# cuadran) y tests/bashrc.sh (el bloque de --global deja ~/.bashrc como estaba).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  atajos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: tests/atajos.sh

  bashrc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: tests/bashrc.sh

  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # los commits viejos son el "desde" de las actualizaciones
          persist-credentials: false
      - run: tests/run ubuntu-server ubuntu-2204 migracion actualizar

  raspberry:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: tests/run pi-trixie pi-bookworm
