# =============================================================================
# tmux — configuración personal (Fase 0)
#
# Requiere tmux >= 3.2 (probada en 3.2a, 3.3a y 3.4). Se instala con ./install tmux.
# Probar cambios sin tocar la config instalada ni tus sesiones:
#   tmux -L prueba -f "$PWD/.tmux.conf" new -s prueba
# (ruta absoluta: con una relativa, prefijo R falla al cambiar de directorio)
#
# Prefijo: el nativo, Ctrl+B (pulsar, soltar y luego la tecla).
# Ayuda con todos los atajos, incluidos los propios: prefijo ?
# =============================================================================

# --- General -----------------------------------------------------------------

# Ratón: clic para elegir pane, arrastrar bordes para redimensionar, rueda para scroll
set -g mouse on

# Historial de scroll por pane (por defecto son 2000 líneas)
set -g history-limit 50000

# Numerar windows y panes desde 1, en el mismo orden que las teclas 1..9
set -g base-index 1
setw -g pane-base-index 1

# Al cerrar una window, renumerar las demás para no dejar huecos (1 3 4 -> 1 2 3)
set -g renumber-windows on

# Colores reales (24 bits) para los programas de dentro, como el tema de neovim.
# Los soportan Windows Terminal, GNOME Terminal, Kitty o iTerm2. Índice fijo:
# así recargar la config no lo vuelve a añadir.
set -s terminal-features[9] 'xterm*:RGB'

# Shell de los panes: zsh si ./install zsh enlazó su config a este repo; si no,
# la de login. La config va en ~/.local/opt/tmux-config/zsh (ZDOTDIR), no en
# ~/.zshrc: "zsh" tecleado fuera de tmux no la carga. Solo cambia lo que arranca
# dentro de tmux: la shell de login, "ssh host comando", root y los demás
# usuarios siguen igual. Si zsh desaparece con tmux en marcha, los panes nuevos
# vuelven a la de login. El ~/.zshrc enlazado es el de antes (git pull sin
# volver a ejecutar ./install zsh): se respeta hasta entonces.
if-shell '[ "$(readlink ~/.local/opt/tmux-config/zsh/.zshrc)" = "$(dirname "$(readlink ~/.tmux.conf)")/zsh/.zshrc" ] && command -v zsh >/dev/null' {
    set -g default-command 'command -v zsh >/dev/null && ZDOTDIR="$HOME/.local/opt/tmux-config/zsh" exec zsh -l; exec "$SHELL" -l'
} {
    if-shell '[ "$(readlink ~/.zshrc)" = "$(dirname "$(readlink ~/.tmux.conf)")/zsh/.zshrc" ] && command -v zsh >/dev/null' {
        set -g default-command 'command -v zsh >/dev/null && exec zsh -l; exec "$SHELL" -l'
    } {
        set -gu default-command
    }
}

# --- Atajos ------------------------------------------------------------------
#
# Un único mapa (docs/CHEATSHEET.md), en dos niveles:
#   - Día a día: Alt+tecla, sin prefijo. Son las teclas de Kitty cambiando
#     Ctrl+Shift por Alt: el terminal no puede enviar Ctrl+Shift+letra.
#   - Ocasional: prefijo Ctrl+B + tecla nativa de tmux.
# No se usan Alt+b/f/d/. porque bash los usa para editar la línea.

# Alt+tecla llega a tmux como Esc seguido de la tecla. Con la espera por defecto
# (500 ms), en vim pulsar Esc y luego l se leería como Alt+l.
set -s escape-time 10

# --- Día a día: Alt ------------------------------------------------------------

# Nuevo pane (Kitty: Ctrl+Shift+Enter), en el directorio actual. Divide por el
# lado más largo (una celda es ~2 veces más alta que ancha) y, si ya elegiste un
# layout con Alt+l, lo reaplica.
bind -n -N "Nuevo pane" M-Enter {
    if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" {
        split-window -h -c "#{pane_current_path}"
    } {
        split-window -v -c "#{pane_current_path}"
    }
    select-layout
}

bind -n -N "Ir al pane izquierdo" M-Left  select-pane -L
bind -n -N "Ir al pane derecho"   M-Right select-pane -R
bind -n -N "Ir al pane superior"  M-Up    select-pane -U
bind -n -N "Ir al pane inferior"  M-Down  select-pane -D

# Mover el pane: lo intercambia con el vecino en esa dirección y el foco lo
# acompaña; en el borde no hace nada (Kitty mueve con Ctrl+Shift+F/B, pero
# Alt+f/b saltan palabra en bash)
bind -n -N "Mover pane a la izquierda" M-S-Left  if -F "#{?pane_at_left,0,1}"   { swap-pane -d -t "{left-of}" }
bind -n -N "Mover pane a la derecha"   M-S-Right if -F "#{?pane_at_right,0,1}"  { swap-pane -d -t "{right-of}" }
bind -n -N "Mover pane arriba"         M-S-Up    if -F "#{?pane_at_top,0,1}"    { swap-pane -d -t "{up-of}" }
bind -n -N "Mover pane abajo"          M-S-Down  if -F "#{?pane_at_bottom,0,1}" { swap-pane -d -t "{down-of}" }

bind -n -N "Maximizar / restaurar pane" M-z resize-pane -Z
bind -n -N "Cerrar pane" M-w confirm-before -p "¿Cerrar pane #P? (y/n)" kill-pane
bind -n -N "Siguiente layout" M-l next-layout

# Modo redimensionar (Kitty: Ctrl+Shift+R): Alt+r entra, las flechas mueven el
# borde del pane actual, = iguala el pane con sus vecinos, Esc/Enter/q salen.
# Mientras dura, la barra lo indica.
bind -n -N "Redimensionar pane (modo)" M-r switch-client -T resize \; refresh-client -S
bind -T resize Left   resize-pane -L 4 \; switch-client -T resize
bind -T resize Right  resize-pane -R 4 \; switch-client -T resize
bind -T resize Up     resize-pane -U 2 \; switch-client -T resize
bind -T resize Down   resize-pane -D 2 \; switch-client -T resize
bind -T resize =      select-layout -E \; switch-client -T resize
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize Enter  switch-client -T root \; refresh-client -S
bind -T resize q      switch-client -T root \; refresh-client -S
# Por defecto la barra corta el lado izquierdo a 10 caracteres (corta el nombre
# de sesión y no cabría el aviso)
set -g status-left-length 70
set -g status-left "#{?#{==:#{client_key_table},resize},#[reverse] REDIMENSIONAR: flechas · = iguala · Esc sale #[default] ,}[#{session_name}] "

bind -n -N "Nueva window"     M-t new-window
# Renombrar la window (Kitty: Ctrl+Shift+Alt+T, título de la pestaña)
bind -n -N "Renombrar window" M-T command-prompt -I "#W" -p "Nombre de la window:" { rename-window "%%" }
# Cerrar la window con todos sus panes (Kitty: Ctrl+Shift+Q, cerrar pestaña)
bind -n -N "Cerrar window" M-q confirm-before -p "¿Cerrar la window #W y todos sus panes? (y/n)" kill-window
bind -n -N "Siguiente window" M-n next-window
bind -n -N "Window anterior"  M-p previous-window
# Mover la window en la barra; el foco la acompaña y en el borde no hace nada
# (Kitty: Ctrl+Shift+. y ,)
bind -n -N "Mover window a la derecha"   M-N if -F "#{?window_end_flag,0,1}"   { swap-window -d -t +1 }
bind -n -N "Mover window a la izquierda" M-P if -F "#{?window_start_flag,0,1}" { swap-window -d -t -1 }
bind -n -N "Ir a la window 1" M-1 select-window -t :=1
bind -n -N "Ir a la window 2" M-2 select-window -t :=2
bind -n -N "Ir a la window 3" M-3 select-window -t :=3
bind -n -N "Ir a la window 4" M-4 select-window -t :=4
bind -n -N "Ir a la window 5" M-5 select-window -t :=5
bind -n -N "Ir a la window 6" M-6 select-window -t :=6
bind -n -N "Ir a la window 7" M-7 select-window -t :=7
bind -n -N "Ir a la window 8" M-8 select-window -t :=8
bind -n -N "Ir a la window 9" M-9 select-window -t :=9

# Sesiones. Dentro de tmux no se puede lanzar "tmux new", de ahí Alt+Shift+s
# (si la sesión ya existe, salta a ella). Detach en Alt+Shift+q porque Alt+d
# borra palabra en bash y Windows Terminal usa Alt+Shift+d para dividir.
bind -n -N "Lista de sesiones"   M-s choose-tree -Zs
bind -n -N "Nueva sesión"        M-S command-prompt -p "Nombre de la nueva sesión:" { new-session -A -s "%%" }
bind -n -N "Salir sin cerrar nada (detach)" M-Q detach-client
# Al cerrar la última window de una sesión, pasar a otra sesión en vez de salir
set -g detach-on-destroy off

# Scroll y búsqueda. Teclas del modo scroll como vim/less (/ busca, n siguiente,
# q sale); sin fijarlo dependen de $EDITOR y cambian de un servidor a otro.
setw -g mode-keys vi
bind -n -N "Modo scroll"            M-PPage copy-mode -u
bind -n -N "Buscar en el historial" M-/ copy-mode \; command-prompt -p "Buscar hacia atrás:" { send-keys -X search-backward "%%" }

# Guía de uso (docs/GUIA.md) en una ventana flotante. Por su ruta en el repo, no
# por el PATH: el servidor tmux guarda el PATH con el que arrancó.
bind -n -N "Guía de tmux" M-h display-popup -E -w 90% -h 90% '"$(dirname "$(readlink ~/.tmux.conf)")/bin/tmux-guia"'

# --- Ocasional: prefijo Ctrl+B -------------------------------------------------

# Dividir en el directorio actual (nativo: el directorio donde arrancó la sesión)
bind -N "Dividir: nuevo pane a la derecha" % split-window -h -c "#{pane_current_path}"
bind -N "Dividir: nuevo pane abajo"       '"' split-window -v -c "#{pane_current_path}"

# Recargar la configuración con la que arrancó tmux, o ~/.tmux.conf si arrancó
# sin ninguna (tmux ya corría cuando se instaló). R estaba libre; r conserva su
# función nativa (redibujar la pantalla).
bind -N "Recargar configuración" R source-file -F "#{?config_files,#{config_files},$HOME/.tmux.conf}" \; display "Configuración recargada"
